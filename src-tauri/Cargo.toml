[workspace]
members = ["crates/core", "crates/server"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort) so third-party parser panics can be caught at the
# command boundary via panic_guard and turned into errors. Slightly
# larger binary, but prevents single-file corruption from killing the server.
panic = "unwind"
strip = true
