[package]
name = "llm-wiki-llm"
version = "0.1.0"
description = "LLM and embedding clients shared by chat, search and ingest"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
tokio = { version = "1", features = ["time", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
