[package]
name = "llm-wiki-storage"
version = "0.1.0"
description = "Project file storage behind the fs seam: pages in Postgres, blobs in MinIO"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
argon2 = "0.5"
tokio = { version = "1", features = ["rt", "sync"] }
rand = "0.8"
serde_json = "1"
serde_yaml_ng = "0.10"
base64 = "0.22"
object_store = { version = "0.12", default-features = false, features = ["aws"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
